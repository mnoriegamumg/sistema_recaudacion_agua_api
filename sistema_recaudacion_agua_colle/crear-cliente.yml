info:
  name: crear-cliente
  type: http

http:
  method: POST
  url: http://localhost:8000/api/clientes
  headers:
    - name: Authorization
      value: Bearer {TOKEN}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: "{\r

      \  \"id_contador\": 1,\r

      \  \"direccion\": \"Calle Principal #45\",\r

      \  \"correo\": \"cliente@email.com\",\r

      \  \"telefono\": \"5551-1234\",\r

      \  \"comunidad\": \"cabecera_municipal\"\r

      }"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
